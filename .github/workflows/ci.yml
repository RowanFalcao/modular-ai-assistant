name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Instalar Poetry e dependencias
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev

    - name: Validar compilacao de arquivos Python
      run: |
        FILES=$(git ls-files '*.py')
        if [ -n "$FILES" ]; then
          python -m py_compile $FILES
        else
          echo "Nenhum arquivo .py encontrado."
        fi

    - name: Executar testes automatizados (Pytest)
      run: |
        poetry run pytest -v
