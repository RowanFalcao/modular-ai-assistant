[project]
name = "modular-ai-assistant"
version = "0.2.0"
description = "Ecossistema Multi-Agente Orquestrado com RAG Local e MCP"
authors = [
    {name = "RowanFalcao",email = "topsecretfalcao@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "openai (==2.54.0)",
    "python-dotenv (==1.2.4)",
    "llama-index (==0.14.25)",
    "qdrant-client (==1.19.1)",
    "llama-index-vector-stores-qdrant (==0.10.4)",
    "llama-index-embeddings-huggingface (==0.8.0)",
    "sentence-transformers (==5.7.0)",
    "mcp (>=2.3.0,<3.0.0)",
    "streamlit (>=1.66.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1,<2.0.0)"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
